[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finssim-isaaclab"
version = "0.1.0"
description = "Pure PyTorch IsaacLab checkpoint adapters for FinsSim ROS2 deployment"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.23.5,<2",
  "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
